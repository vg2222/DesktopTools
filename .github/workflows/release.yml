name: Build release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate release version and notes
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/DesktopTools/DesktopTools.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Stable releases require major.minor.patch.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and project version must match.' }
          if (!(Test-Path -LiteralPath "docs/releases/$version.md")) { throw 'Versioned release notes are missing.' }
      - name: Fetch checksum-pinned translation models
        shell: pwsh
        run: ./scripts/fetch-translation-models.ps1
      - name: Build and test
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./scripts/test.ps1
      - name: Build installer and portable package
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Verify release integrity
        shell: pwsh
        run: ./scripts/verify-release.ps1
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/DesktopTools/DesktopTools.csproj -Raw
          "value=$($project.Project.PropertyGroup.Version)" >> $env:GITHUB_OUTPUT
      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: DesktopTools-${{ steps.version.outputs.value }}-win-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            App release/DesktopTools-${{ steps.version.outputs.value }}-win-x64-setup.exe
            App release/DesktopTools-${{ steps.version.outputs.value }}-win-x64-portable.zip
            App release/RELEASE-NOTES.md
            App release/SHA256SUMS.txt
            App release/release.json
      - name: Publish tagged GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if ($env:GITHUB_REF_NAME -ne "v$env:VERSION") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $env:VERSION."
          }
          gh release create $env:GITHUB_REF_NAME `
            "App release/DesktopTools-$env:VERSION-win-x64-setup.exe" `
            "App release/DesktopTools-$env:VERSION-win-x64-portable.zip" `
            "App release/SHA256SUMS.txt" `
            "App release/release.json" `
            --title "DesktopTools $env:VERSION" `
            --notes-file "docs/releases/$env:VERSION.md" `
            --verify-tag --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
