name: Windows build and checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Fetch checksum-pinned translation models
        shell: pwsh
        run: ./scripts/fetch-translation-models.ps1
      - name: Install the Russian Windows OCR language
        # The privacy-review checks include Russian labels, so the runner needs the same OCR
        # recognizers as a development machine (the hosted image only ships en-US).
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name 'Language.OCR~~~ru-RU~0.0.1.0' | Out-String | Write-Host
          Get-WindowsCapability -Online -Name 'Language.OCR*' | Where-Object State -eq 'Installed' | Select-Object Name, State | Format-Table | Out-String | Write-Host
      - name: Restore and build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Run automated harnesses
        shell: pwsh
        run: ./scripts/test.ps1

# Visible desktop, hardware, other-process input, and remote viewer checks remain manual.
